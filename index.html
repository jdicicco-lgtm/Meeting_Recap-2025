<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Fleet & Booking Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: Inter, sans-serif; }
    .glass {
      background: rgba(15,23,42,.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.06);
    }
    canvas { height: 360px !important; }
  </style>
</head>

<body class="bg-slate-900 text-slate-100">

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-72 p-6 space-y-6 glass">
    <h2 class="text-lg font-semibold">Filtri</h2>

    <select class="w-full bg-slate-800 p-2 rounded">
      <option>Tutti i mesi</option>
    </select>

    <select class="w-full bg-slate-800 p-2 rounded">
      <option>Tutte le sedi</option>
    </select>

    <select class="w-full bg-slate-800 p-2 rounded">
      <option>Tutti i provider</option>
    </select>

    <button class="w-full bg-slate-700 hover:bg-slate-600 p-2 rounded text-sm">
      Reset filtri
    </button>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-10 space-y-10">

    <!-- HEADER -->
    <header>
      <h1 class="text-3xl font-bold">Fleet & Booking Analytics</h1>
      <p class="text-slate-400">Executive Capacity & Demand Planning</p>
    </header>

    <!-- KPI -->
    <section class="grid grid-cols-6 gap-6">
      <div class="glass p-6 rounded">
        <p class="text-xs text-slate-400">Flotta Media</p>
        <p class="text-3xl font-bold">–</p>
      </div>

      <div class="glass p-6 rounded">
        <p class="text-xs text-slate-400">Rental Days</p>
        <p class="text-3xl font-bold">–</p>
      </div>

      <div class="glass p-6 rounded">
        <p class="text-xs text-slate-400">Occupancy %</p>
        <p class="text-3xl font-bold">–</p>
      </div>

      <div class="glass p-6 rounded">
        <p class="text-xs text-slate-400">Prenotazioni</p>
        <p class="text-3xl font-bold">–</p>
      </div>

      <div class="glass p-6 rounded">
        <p class="text-xs text-slate-400">Canoni €</p>
        <p class="text-3xl font-bold">–</p>
      </div>

      <div class="glass p-6 rounded">
        <p class="text-xs text-slate-400">Assicurazioni €</p>
        <p class="text-3xl font-bold">–</p>
      </div>
    </section>

    <!-- CHARTS -->
    <section class="grid grid-cols-2 gap-8">

      <div class="glass p-6 rounded">
        <h3 class="mb-2 font-semibold">Fleet Gap</h3>
        <canvas id="gapChart"></canvas>
      </div>

      <div class="glass p-6 rounded">
        <h3 class="mb-2 font-semibold">Prenotazioni Mensili</h3>
        <canvas id="bookChart"></canvas>
      </div>

      <div class="glass p-6 rounded">
        <h3 class="mb-2 font-semibold">Ancillaries (€)</h3>
        <canvas id="ancChart"></canvas>
      </div>

      <div class="glass p-6 rounded">
        <h3 class="mb-2 font-semibold">Costi Flotta</h3>
        <canvas id="costChart"></canvas>
      </div>

    </section>

  </main>
</div>

<script>
/* TEST CHART STATICI (solo per verificare che tutto funzioni) */

new Chart(document.getElementById('gapChart'),{
  type:'bar',
  data:{
    labels:['Jan','Feb','Mar'],
    datasets:[{label:'Fleet Gap',data:[-5,3,8]}]
  }
});

new Chart(document.getElementById('bookChart'),{
  type:'line',
  data:{
    labels:['Jan','Feb','Mar'],
    datasets:[{label:'Bookings',data:[120,180,160]}]
  }
});

new Chart(document.getElementById('ancChart'),{
  type:'bar',
  data:{
    labels:['Jan','Feb','Mar'],
    datasets:[{label:'Ancillaries €',data:[2400,3100,2800]}]
  }
});

new Chart(document.getElementById('costChart'),{
  type:'bar',
  data:{
    labels:['Jan','Feb','Mar'],
    datasets:[
      {label:'Canoni',data:[5000,5200,5100]},
      {label:'Assicurazioni',data:[800,820,810]}
    ]
  }
});
</script>

</body>
</html>
