<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Fleet & Booking Analytics – Capacity Planning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind (DEV – usare build in prod) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

<div id="loading" class="fixed inset-0 flex items-center justify-center bg-slate-900 z-50">
  <div class="animate-pulse text-slate-400 text-lg">Loading data…</div>
</div>

<div class="p-6 space-y-6">

<header class="flex justify-between items-center">
  <h1 class="text-2xl font-semibold">Fleet & Booking Analytics – Capacity Planning</h1>
  <div class="flex gap-3">
    <select id="monthFilter" class="bg-slate-800 px-3 py-2 rounded">
      <option value="all">All Months</option>
    </select>
    <select id="branchFilter" class="bg-slate-800 px-3 py-2 rounded">
      <option value="all">All Branch Offices</option>
    </select>
    <select id="providerFilter" class="bg-slate-800 px-3 py-2 rounded">
      <option value="all">All Providers</option>
    </select>
  </div>
</header>

<section class="grid grid-cols-6 gap-4">
  <div class="glass rounded-xl p-4"><p class="text-xs text-slate-400">Flotta Media</p><p id="kpiFleet" class="text-2xl">–</p></div>
  <div class="glass rounded-xl p-4"><p class="text-xs text-slate-400">Rental Days</p><p id="kpiRentalDays" class="text-2xl">–</p></div>
  <div class="glass rounded-xl p-4"><p class="text-xs text-slate-400">Flotta Provider</p><p id="kpiFleetProvider" class="text-2xl">–</p></div>
  <div class="glass rounded-xl p-4"><p class="text-xs text-slate-400">N. Prenotazioni</p><p id="kpiBookings" class="text-2xl">–</p></div>
  <div class="glass rounded-xl p-4"><p class="text-xs text-slate-400">Auto Prenotate (distinte)</p><p id="kpiAutos" class="text-2xl">–</p></div>
  <div class="glass rounded-xl p-4"><p class="text-xs text-slate-400">Ancillaries</p><p id="kpiAncillaries" class="text-2xl">–</p><p id="kpiAncillariesAvg" class="text-xs text-slate-400">Media: –</p></div>
</section>

<section class="grid grid-cols-2 gap-6">
  <div class="glass rounded-xl p-4">
    <h2 class="text-sm mb-2 text-slate-300">Cartype Distribution</h2>
    <div class="relative h-[300px]"><canvas id="cartypeChart"></canvas></div>
  </div>
  <div class="glass rounded-xl p-4">
    <h2 class="text-sm mb-2 text-slate-300">Daily Bookings vs Autos</h2>
    <div class="relative h-[300px]"><canvas id="dailyChart"></canvas></div>
  </div>
</section>

</div>

<script>
/***********************
 * UTILS
 ***********************/
function unique(arr) { return [...new Set(arr.filter(Boolean))]; }
function safeNumber(v) { return Number.isFinite(Number(v)) ? Number(v) : 0; }

/***********************
 * INIT
 ***********************/
function init() {
  populateFilters();
  renderAll();
}

/***********************
 * SAFE JSON LOADER
 ***********************/
function loadSafeJSON(url) {
  return fetch(url)
    .then(r => r.text())
    .then(t => {
      const safeText = t
        .replace(/:\s*NaN/g, ': null')
        .replace(/:\s*Infinity/g, ': null')
        .replace(/:\s*-Infinity/g, ': null');
      return JSON.parse(safeText);
    });
}

/***********************
 * DATA LOADING
 ***********************/
const files = {
  bookings: 'Clean booking 2.json',
  flottaMonth: 'flotta stazioni mese 2025.json',
  flottaProvider: 'flotta dicembre 2025.json',
  cartype: 'FLOTTA STAZIONI-Cartype GEN-DIC 25.json'
};

const state = { bookings: [], flottaMonth: [], flottaProvider: [], cartype: [] };

Promise.all([
  loadSafeJSON(files.bookings),
  loadSafeJSON(files.flottaMonth),
  loadSafeJSON(files.flottaProvider),
  loadSafeJSON(files.cartype)
])
.then(([b, fm, fp, c]) => {
  state.bookings = Object.values(b)[0].map(r => ({
    branch: r['Branch office'],
    provider: r['Provider'],
    auto: r['Auto'],
    checkout: r['Check-out'],
    ancillaries: safeNumber(r['Ancillaries vendute'])
  }));

  state.flottaMonth = Object.values(fm)[0];
  state.flottaProvider = Object.values(fp)[0];
  state.cartype = Object.values(c)[0];

  init();
})
.catch(err => {
  alert('Errore caricamento dati: ' + err.message);
  console.error(err);
})
.finally(() => document.getElementById('loading').remove());

let cartypeChart, dailyChart;

/***********************
 * FILTERS
 ***********************/
function populateFilters() {
  unique(state.cartype.map(r => r.Mese)).forEach(m => monthFilter.innerHTML += `<option value="${m}">${m}</option>`);
  unique(state.cartype.map(r => r['Branch Office'])).forEach(b => branchFilter.innerHTML += `<option value="${b}">${b}</option>`);
  unique(state.bookings.map(r => r.provider)).forEach(p => providerFilter.innerHTML += `<option value="${p}">${p}</option>`);
}

monthFilter.onchange = branchFilter.onchange = providerFilter.onchange = renderAll;

/***********************
 * FILTERED DATASETS
 ***********************/
function bookingsFiltered() {
  return state.bookings.filter(r =>
    (branchFilter.value === 'all' || r.branch === branchFilter.value) &&
    (providerFilter.value === 'all' || r.provider === providerFilter.value)
  );
}

function flottaMonthFiltered() {
  return state.flottaMonth.filter(r => monthFilter.value === 'all' || r.Mese === monthFilter.value);
}

/***********************
 * KPI & RENDER
 ***********************/
function renderAll() {
  const b = bookingsFiltered();
  const fMonth = flottaMonthFiltered();

  kpiFleet.textContent = fMonth.reduce((a, r) => a + safeNumber(r['Flotta media']), 0);
  kpiRentalDays.textContent = fMonth.reduce((a, r) => a + safeNumber(r['Rental Days']), 0);

  const fleetProv = state.flottaProvider.filter(r => providerFilter.value === 'all' || r.Provider === providerFilter.value);
  kpiFleetProvider.textContent = unique(fleetProv.map(r => r['License Plate'])).length;

  kpiBookings.textContent = b.length;
  kpiAutos.textContent = unique(b.map(r => r.auto)).length;

  const totalAnc = b.reduce((a, r) => a + r.ancillaries, 0);
  kpiAncillaries.textContent = totalAnc;
  kpiAncillariesAvg.textContent = 'Media: ' + (b.length ? (totalAnc / b.length).toFixed(2) : '0');

  renderDailyChart(b);
  renderCartype();
}

/***********************
 * CHARTS
 ***********************/
function renderCartype() {
  const filtered = state.cartype.filter(r =>
    (monthFilter.value === 'all' || r.Mese === monthFilter.value) &&
    (branchFilter.value === 'all' || r['Branch Office'] === branchFilter.value)
  );

  const grouped = {};
  filtered.forEach(r => grouped[r.CarType] = (grouped[r.CarType] || 0) + safeNumber(r.flotta));

  cartypeChart?.destroy();
  cartypeChart = new Chart(document.getElementById('cartypeChart'), {
    type: 'doughnut',
    data: { labels: Object.keys(grouped), datasets: [{ data: Object.values(grouped) }] },
    options: { maintainAspectRatio: false }
  });
}

function renderDailyChart(data) {
  const daily = {};
  data.forEach(r => {
    if (!r.checkout) return;
    if (!daily[r.checkout]) daily[r.checkout] = { bookings: 0, autos: new Set() };
    daily[r.checkout].bookings++;
    if (r.auto) daily[r.checkout].autos.add(r.auto);
  });

  const labels = Object.keys(daily).sort();
  const bookings = labels.map(d => daily[d].bookings);
  const autos = labels.map(d => daily[d].autos.size);

  dailyChart?.destroy();
  dailyChart = new Chart(document.getElementById('dailyChart'), {
    type: 'line',
    data: { labels, datasets: [
      { label: 'Prenotazioni', data: bookings, fill: true },
      { label: 'Auto Distinte', data: autos }
    ]},
    options: { interaction: { mode: 'index', intersect: false }, maintainAspectRatio: false }
  });
}
</script>
</body>
</html>
