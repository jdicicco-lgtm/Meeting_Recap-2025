<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Fleet & Booking Analytics – Executive Capacity Planning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: Inter, sans-serif; }
.glass {
  background: rgba(15,23,42,.9);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.06);
}
canvas { height: 420px !important; }
</style>
</head>

<body class="bg-slate-900 text-slate-100">

<div id="loading" class="fixed inset-0 flex items-center justify-center bg-slate-900 z-50">
  <div class="animate-pulse text-slate-400 text-lg">Loading dashboard…</div>
</div>

<div class="flex min-h-screen">

<!-- SIDEBAR -->
<aside class="w-72 p-6 space-y-6 glass">
  <h2 class="text-lg font-semibold">Filtri</h2>

  <select id="monthFilter" class="w-full bg-slate-800 p-2 rounded">
    <option value="all">Tutti i mesi</option>
  </select>

  <select id="branchFilter" class="w-full bg-slate-800 p-2 rounded">
    <option value="all">Tutte le sedi</option>
  </select>

  <select id="providerFilter" class="w-full bg-slate-800 p-2 rounded">
    <option value="all">Tutti i provider</option>
  </select>

  <button onclick="resetFilters()" class="w-full bg-slate-700 hover:bg-slate-600 p-2 rounded text-sm">
    Reset filtri
  </button>
</aside>

<!-- MAIN -->
<main class="flex-1 p-10 space-y-12">

<header>
  <h1 class="text-3xl font-bold">Fleet & Booking Analytics</h1>
  <p class="text-slate-400">Executive Capacity & Demand Planning</p>
</header>

<!-- KPI -->
<section class="grid grid-cols-6 gap-6">
  <div class="glass p-6 rounded"><p class="text-xs">Flotta Media</p><p id="kpiFleet" class="text-3xl font-bold">–</p></div>
  <div class="glass p-6 rounded"><p class="text-xs">Rental Days</p><p id="kpiRental" class="text-3xl font-bold">–</p></div>
  <div class="glass p-6 rounded"><p class="text-xs">Occupancy %</p><p id="kpiOcc" class="text-3xl font-bold">–</p></div>
  <div class="glass p-6 rounded"><p class="text-xs">Prenotazioni</p><p id="kpiBookings" class="text-3xl font-bold">–</p></div>
  <div class="glass p-6 rounded"><p class="text-xs">Ancillaries Tot €</p><p id="kpiAncTot" class="text-3xl font-bold">–</p></div>
  <div class="glass p-6 rounded"><p class="text-xs">Ancillaries Avg €</p><p id="kpiAncAvg" class="text-3xl font-bold">–</p></div>
</section>

<!-- CHARTS -->
<section class="grid grid-cols-2 gap-10">
  <div class="glass p-6 rounded"><h3>Flotta vs Domanda (Fleet Gap)</h3><canvas id="gapChart"></canvas></div>
  <div class="glass p-6 rounded"><h3>Prenotazioni Mensili</h3><canvas id="bookChart"></canvas></div>
  <div class="glass p-6 rounded"><h3>Ancillaries Mensili (€)</h3><canvas id="ancChart"></canvas></div>
  <div class="glass p-6 rounded"><h3>Scenario Planning</h3><canvas id="forecastChart"></canvas></div>
</section>

</main>
</div>

<script>
/* ========= UTILS ========= */
const safe = v => Number.isFinite(Number(v)) ? Number(v) : 0;
const uniq = a => [...new Set(a.filter(Boolean))];
const month = d => {
  const x = new Date(d);
  return isNaN(x) ? null : `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;
};
const load = f => fetch(f).then(r=>r.text()).then(t=>JSON.parse(t.replace(/:\s*(NaN|Infinity|-Infinity)/g,':null')));

/* ========= STATE ========= */
const state = { bookings:[], flotta:[] };

/* ========= LOAD ========= */
Promise.all([
  load('Clean booking 2.json'),
  load('flotta stazioni mese 2025.json')
]).then(([b,f])=>{
  state.bookings = Object.values(b)[0]
    .map(r=>({
      branch:r['Branch office'],
      provider:r['Provider'],
      month:month(r['Check-out']),
      anc:safe(r['Ancillaries vendute'])
    }))
    .filter(r=>r.month);

  state.flotta = Object.values(f)[0]
    .map(r=>({month:r.Mese,fleet:safe(r['Flotta media']),rental:safe(r['Rental Days'])}));

  initFilters();
  render();
}).finally(()=>loading.remove());

/* ========= FILTERS ========= */
function initFilters(){
  uniq(state.flotta.map(r=>r.month)).forEach(m=>monthFilter.innerHTML+=`<option>${m}</option>`);
  uniq(state.bookings.map(r=>r.branch)).forEach(b=>branchFilter.innerHTML+=`<option>${b}</option>`);
  uniq(state.bookings.map(r=>r.provider)).forEach(p=>providerFilter.innerHTML+=`<option>${p}</option>`);
}
monthFilter.onchange = branchFilter.onchange = providerFilter.onchange = render;
function resetFilters(){
  monthFilter.value=branchFilter.value=providerFilter.value='all';
  render();
}

/* ========= CALENDAR ========= */
function activeMonths(){
  return monthFilter.value==='all'
    ? state.flotta.map(r=>r.month)
    : [monthFilter.value];
}

/* ========= FILTERED ========= */
function bookings(){
  const m = activeMonths();
  return state.bookings.filter(r =>
    m.includes(r.month) &&
    (branchFilter.value==='all'||r.branch===branchFilter.value) &&
    (providerFilter.value==='all'||r.provider===providerFilter.value)
  );
}
function flotta(){
  const m = activeMonths();
  return state.flotta.filter(r=>m.includes(r.month));
}

/* ========= RENDER ========= */
let gapChart, bookChart, ancChart, forecastChart;

function render(){
  const b = bookings();
  const f = flotta();

  const fleet = monthFilter.value==='all'
    ? Math.round(f.reduce((a,r)=>a+r.fleet,0)/f.length)
    : f[0]?.fleet||0;

  const rental = f.reduce((a,r)=>a+r.rental,0);
  const occ = monthFilter.value==='all'
    ? Math.round(f.reduce((a,r)=>a+(r.rental/(r.fleet*30)),0)/f.length*100)
    : Math.round((rental/(fleet*30))*100);

  const ancTot = b.reduce((a,r)=>a+r.anc,0);

  kpiFleet.textContent = fleet;
  kpiRental.textContent = rental;
  kpiOcc.textContent = occ+'%';
  kpiBookings.textContent = b.length;
  kpiAncTot.textContent = ancTot.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
  kpiAncAvg.textContent = (b.length?ancTot/b.length:0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});

  charts(b,f);
}

/* ========= CHARTS ========= */
function charts(b,f){
  const months = f.map(r=>r.month);

  const demand = {};
  b.forEach(r=>demand[r.month]=(demand[r.month]||0)+1);

  const fleet = {};
  f.forEach(r=>fleet[r.month]=r.fleet);

  const gap = months.map(m => (demand[m]||0) - (fleet[m]||0));

  gapChart?.destroy();
  gapChart = new Chart(document.getElementById('gapChart'),{
    type:'bar',
    data:{labels:months,datasets:[{label:'Fleet Gap',data:gap,backgroundColor:gap.map(v=>v>0?'#ef4444':'#22c55e')}]},
    options:{maintainAspectRatio:false}
  });

  bookChart?.destroy();
  bookChart = new Chart(document.getElementById('bookChart'),{
    type:'line',
    data:{labels:months,datasets:[{label:'Prenotazioni',data:months.map(m=>demand[m]||0),borderColor:'#38bdf8',fill:true}]},
    options:{maintainAspectRatio:false}
  });

  ancChart?.destroy();
  ancChart = new Chart(document.getElementById('ancChart'),{
    type:'bar',
    data:{labels:months,datasets:[{label:'Ancillaries €',data:months.map(m=>b.filter(x=>x.month===m).reduce((a,x)=>a+x.anc,0)),backgroundColor:'#f59e0b'}]},
    options:{maintainAspectRatio:false}
  });

  const base = months.map(m=>demand[m]||0);
  const s10 = base.map(v=>Math.round(v*1.1));
  const s20 = base.map(v=>Math.round(v*1.2));

  forecastChart?.destroy();
  forecastChart = new Chart(document.getElementById('forecastChart'),{
    type:'line',
    data:{labels:months,datasets:[
      {label:'Storico',data:base,borderColor:'#38bdf8'},
      {label:'+10%',data:s10,borderColor:'#f59e0b',borderDash:[5,5]},
      {label:'+20%',data:s20,borderColor:'#ef4444',borderDash:[5,5]}
    ]},
    options:{maintainAspectRatio:false}
  });
}
</script>
</body>
</html>
